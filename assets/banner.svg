<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#050b14"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#7000ff"/></linearGradient><linearGradient id="chartGrad1" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".4"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/></linearGradient><linearGradient id="chartGrad2" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".35"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="strongGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="10"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes waveFloat{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes scanline{0%{transform:translateY(-40px);opacity:0}50%{opacity:.8}}@keyframes barPulse{0%{transform:scaleY(1)}50%{transform:scaleY(.75)}}.grid-bg{fill:url(#grid)}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-1px}.badge-text,.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}.subtitle-text{font-size:17px;fill:#94a3b8;font-weight:400}.pill-text{font-size:12px;font-weight:600;fill:#e2e8f0}.pulsing-orb{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.floating-layer{animation:waveFloat 5s ease-in-out infinite}.scan-beam{animation:scanline 7s ease-in-out infinite}.stream-line{stroke-dasharray:8 6;animation:dashCycle 8s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" class="grid-bg"/><circle cx="200" cy="80" r="140" fill="#38bdf8" class="pulsing-orb" filter="url(#strongGlow)" opacity=".12"/><circle cx="1020" cy="200" r="160" fill="#a855f7" class="pulsing-orb" filter="url(#strongGlow)" opacity=".15" style="animation-delay:-3s"/><circle cx="700" cy="300" r="100" fill="#06b6d4" class="pulsing-orb" filter="url(#strongGlow)" opacity=".1" style="animation-delay:-1.5s"/><line x1="0" x2="1200" y1="0" y2="0" stroke="url(#accentGrad)" stroke-width="2" class="scan-beam" opacity=".4"/><g class="floating-layer" transform="translate(720, 65)"><rect width="430" height="230" x="0" y="0" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" rx="16"/><circle cx="28" cy="28" r="5" fill="#ef4444" opacity=".8"/><circle cx="44" cy="28" r="5" fill="#eab308" opacity=".8"/><circle cx="60" cy="28" r="5" fill="#22c55e" opacity=".8"/><text x="80" y="32" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">LIVE TELEMETRY STREAM &amp; KPI DISCOVERY</text><circle cx="395" cy="28" r="4" fill="#22c55e" filter="url(#glow)"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.2;1"/></circle><text x="350" y="32" fill="#22c55e" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">ACTIVE</text><line x1="25" x2="405" y1="75" y2="75" stroke="rgba(255,255,255,0.06)" stroke-width="1"/><line x1="25" x2="405" y1="125" y2="125" stroke="rgba(255,255,255,0.06)" stroke-width="1"/><line x1="25" x2="405" y1="175" y2="175" stroke="rgba(255,255,255,0.06)" stroke-width="1"/><path fill="url(#chartGrad2)" d="M 25 185 Q 90 120, 160 145 T 280 110 T 405 75 L 405 200 L 25 200 Z"/><path fill="none" stroke="#a855f7" stroke-width="2.5" d="M 25 185 Q 90 120, 160 145 T 280 110 T 405 75"/><path fill="url(#chartGrad1)" d="M 25 195 Q 85 90, 150 125 T 275 80 T 405 50 L 405 200 L 25 200 Z"/><path fill="none" stroke="#00f2fe" stroke-width="3" d="M 25 195 Q 85 90, 150 125 T 275 80 T 405 50" class="stream-line" filter="url(#glow)"/><circle cx="275" cy="80" r="5" fill="#fff" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"><animate attributeName="r" dur="2.5s" repeatCount="indefinite" values="4;7;4"/></circle><g transform="translate(25, 204)"><rect width="115" height="18" x="0" y="0" fill="rgba(56, 189, 248, 0.12)" rx="4"/><text x="8" y="13" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">EPS: 420K/SEC</text></g><g transform="translate(150, 204)"><rect width="115" height="18" x="0" y="0" fill="rgba(34, 197, 94, 0.12)" rx="4"/><text x="8" y="13" fill="#22c55e" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">LATENCY: 12ms</text></g><g transform="translate(275, 204)"><rect width="130" height="18" x="0" y="0" fill="rgba(168, 85, 247, 0.12)" rx="4"/><text x="8" y="13" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">COMPRESSION: 140x</text></g></g><g><g transform="translate(60, 65) translate(0, 0)"><rect width="280" height="28" x="0" y="0" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" rx="14"/><circle cx="14" cy="14" r="5" fill="#38bdf8" filter="url(#glow)"/><text x="28" y="19" class="badge-text">ENTERPRISE TELEMETRY &amp; BI</text></g><text x="0" y="80" class="title-text" transform="translate(60, 65)">Awesome <tspan fill="url(#accentGrad)">Operational Analytics</tspan></text><text x="0" y="118" class="subtitle-text" transform="translate(60, 65)">Curated index of real-time intelligence platforms, machine telemetry engines,</text><text x="0" y="142" class="subtitle-text" transform="translate(60, 65)">cloud observability stacks, and open-source operational BI dashboards.</text><g><g transform="translate(60, 65) translate(0, 180) translate(0, 0)"><rect width="135" height="34" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" rx="17"/><text x="16" y="21" class="pill-text">⚡ Real-Time Logs</text></g><g transform="translate(60, 65) translate(0, 180) translate(145, 0)"><rect width="135" height="34" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" rx="17"/><text x="16" y="21" class="pill-text">📈 Metrics &amp; Traces</text></g><g transform="translate(60, 65) translate(0, 180) translate(290, 0)"><rect width="145" height="34" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" rx="17"/><text x="16" y="21" class="pill-text">📊 Operational BI</text></g><g transform="translate(60, 65) translate(0, 180) translate(445, 0)"><rect width="150" height="34" x="0" y="0" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" rx="17"/><text x="16" y="21" fill="#38bdf8" class="pill-text">🚀 Open Source &amp; SaaS</text></g></g></g><rect width="1200" height="4" x="0" y="356" fill="url(#accentGrad)"/></svg>