<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>

    <!-- Glowing Highlights -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="chartGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="chartGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Pulse Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-bg { fill: url(#grid); }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      fill: #94a3b8;
      font-weight: 400;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes waveFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-40px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes barPulse {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.75); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -200; }
    }

    .pulsing-orb {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-layer {
      animation: waveFloat 5s ease-in-out infinite;
    }
    .scan-beam {
      animation: scanline 7s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: dashCycle 8s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" class="grid-bg" />

  <!-- Animated Ambient Light Orbs (Background) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#strongGlow)" class="pulsing-orb" />
  <circle cx="1020" cy="200" r="160" fill="#a855f7" opacity="0.15" filter="url(#strongGlow)" class="pulsing-orb" style="animation-delay: -3s;" />
  <circle cx="700" cy="300" r="100" fill="#06b6d4" opacity="0.1" filter="url(#strongGlow)" class="pulsing-orb" style="animation-delay: -1.5s;" />

  <!-- Scanning Light Beam -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2" class="scan-beam" opacity="0.4" />

  <!-- Dynamic Graphic Section (Right Side) -->
  <g class="floating-layer" transform="translate(720, 65)">
    <!-- Glass Panel Behind Chart -->
    <rect x="0" y="0" width="430" height="230" rx="16" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Mini Status Header -->
    <circle cx="28" cy="28" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="28" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="60" cy="28" r="5" fill="#22c55e" opacity="0.8" />
    <text x="80" y="32" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" font-weight="600">LIVE TELEMETRY STREAM &amp; KPI DISCOVERY</text>
    <circle cx="395" cy="28" r="4" fill="#22c55e" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="350" y="32" font-family="-apple-system, sans-serif" font-size="11" fill="#22c55e" font-weight="600">ACTIVE</text>

    <!-- Grid lines inside panel -->
    <line x1="25" y1="75" x2="405" y2="75" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <line x1="25" y1="125" x2="405" y2="125" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <line x1="25" y1="175" x2="405" y2="175" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Chart 2 Area & Curve -->
    <path d="M 25 185 Q 90 120, 160 145 T 280 110 T 405 75 L 405 200 L 25 200 Z" fill="url(#chartGrad2)" />
    <path d="M 25 185 Q 90 120, 160 145 T 280 110 T 405 75" fill="none" stroke="#a855f7" stroke-width="2.5" />

    <!-- Chart 1 Area & Real-Time Animated Curve -->
    <path d="M 25 195 Q 85 90, 150 125 T 275 80 T 405 50 L 405 200 L 25 200 Z" fill="url(#chartGrad1)" />
    <path d="M 25 195 Q 85 90, 150 125 T 275 80 T 405 50" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" class="stream-line" />

    <!-- Live Floating Data Point -->
    <circle cx="275" cy="80" r="5" fill="#ffffff" stroke="#00f2fe" stroke-width="3" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Mini KPI Metric Badges -->
    <g transform="translate(25, 204)">
      <rect x="0" y="0" width="115" height="18" rx="4" fill="rgba(56, 189, 248, 0.12)" />
      <text x="8" y="13" font-family="-apple-system, sans-serif" font-size="10" fill="#38bdf8" font-weight="700">EPS: 420K/SEC</text>
    </g>
    <g transform="translate(150, 204)">
      <rect x="0" y="0" width="115" height="18" rx="4" fill="rgba(34, 197, 94, 0.12)" />
      <text x="8" y="13" font-family="-apple-system, sans-serif" font-size="10" fill="#22c55e" font-weight="700">LATENCY: 12ms</text>
    </g>
    <g transform="translate(275, 204)">
      <rect x="0" y="0" width="130" height="18" rx="4" fill="rgba(168, 85, 247, 0.12)" />
      <text x="8" y="13" font-family="-apple-system, sans-serif" font-size="10" fill="#c084fc" font-weight="700">COMPRESSION: 140x</text>
    </g>
  </g>

  <!-- Left Main Content & Foreground Typography (High Contrast, Unhidden) -->
  <g transform="translate(60, 65)">
    <!-- Top Super-Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" filter="url(#glow)" />
      <text x="28" y="19" class="badge-text">ENTERPRISE TELEMETRY &amp; BI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">
      Awesome <tspan fill="url(#accentGrad)">Operational Analytics</tspan>
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="118" class="subtitle-text">
      Curated index of real-time intelligence platforms, machine telemetry engines,
    </text>
    <text x="0" y="142" class="subtitle-text">
      cloud observability stacks, and open-source operational BI dashboards.
    </text>

    <!-- Pill Feature Badges -->
    <g transform="translate(0, 180)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" />
        <text x="16" y="21" class="pill-text">⚡ Real-Time Logs</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" />
        <text x="16" y="21" class="pill-text">📈 Metrics &amp; Traces</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(290, 0)">
        <rect x="0" y="0" width="145" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" />
        <text x="16" y="21" class="pill-text">📊 Operational BI</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(445, 0)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
        <text x="16" y="21" class="pill-text" fill="#38bdf8">🚀 Open Source &amp; SaaS</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)" />
</svg>